server {
    listen 80;
    server_name _;

    # 사진을 최대 5장(장당 20MB) 올릴 수 있도록 업로드 용량 제한을 100MB로 넉넉히 설정
    client_max_body_size 100M;

    # 1. 프론트엔드 (React 빌드 정적 파일 서빙)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        # React Router(/feed, /login, /Lucas 등) 새로고침 시 404 에러 방지!
        try_files $uri $uri/ /index.html;
    }

    # 2. 백엔드 API 요청 (/api로 시작하면 FastAPI 컨테이너로 전달)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. 업로드된 사진 요청 (/uploads로 시작하면 FastAPI의 정적 폴더로 전달)
    location /uploads/ {
        proxy_pass http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }
}